stages:
  - test

default:
  tags:
    - k8s
    - amd64
  services:
    - name: postgres:18
      variables:
        HEALTHCHECK_TCP_PORT: "5432"
    - name: open62541/open62541:latest
      alias: opcua
      variables:
        HEALTHCHECK_TCP_PORT: "4840"
    - name: quay.io/artemiscloud/activemq-artemis-broker:artemis.2.38.0
      alias: artemis
      entrypoint: ["/bin/sh", "-ec"]
      command:
        - |
          /opt/amq/bin/artemis create \
            --user "$AMQ_USER" \
            --password "$AMQ_PASSWORD" \
            --role admin \
            --name broker \
            --allow-anonymous \
            --host 0.0.0.0 \
            --http-host 0.0.0.0 \
            --force \
            --no-fsync \
            --silent \
            --no-mqtt-acceptor \
            /home/jboss/broker
          # disable the disk usage check; the broker shares the runner node's disk, and when it is more
          # than <max-disk-usage> (90%) full, Artemis blocks producers and closes MQTT connections when
          # a message is published ("AMQ834002: Error processing control packet"), which the client sees
          # as "Connection lost (32109) - java.io.EOFException"; this broker holds only throwaway test
          # data, so the check serves no purpose here
          sed -i 's|<max-disk-usage>[^<]*</max-disk-usage>|<max-disk-usage>-1</max-disk-usage>|' \
            /home/jboss/broker/etc/broker.xml
          grep -q '<max-disk-usage>-1</max-disk-usage>' /home/jboss/broker/etc/broker.xml
          exec /home/jboss/broker/bin/artemis run
      variables:
        AMQ_USER: admin
        AMQ_PASSWORD: admin
        HEALTHCHECK_TCP_PORT: "61616"
    # single-node KRaft Kafka broker for the KafkaDataProvider integration test; the configuration is written
    # explicitly because the image turns every KAFKA_* environment variable into a broker property, and the
    # job variables (including KAFKA_CONNECTION) are passed to all service containers; the health check on the
    # client port holds the job until the broker accepts connections
    - name: apache/kafka:3.9.0
      alias: kafka
      entrypoint: ["/bin/sh", "-ec"]
      command:
        - |
          cat > /tmp/server.properties <<'EOF'
          process.roles=broker,controller
          node.id=1
          controller.quorum.voters=1@localhost:9093
          listeners=PLAINTEXT://0.0.0.0:9092,CONTROLLER://localhost:9093
          advertised.listeners=PLAINTEXT://kafka:9092
          controller.listener.names=CONTROLLER
          inter.broker.listener.name=PLAINTEXT
          listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          log.dirs=/tmp/kraft-logs
          num.partitions=1
          auto.create.topics.enable=true
          offsets.topic.replication.factor=1
          transaction.state.log.replication.factor=1
          transaction.state.log.min.isr=1
          group.initial.rebalance.delay.ms=0
          EOF
          /opt/kafka/bin/kafka-storage.sh format --ignore-formatted -c /tmp/server.properties \
            -t "$(/opt/kafka/bin/kafka-storage.sh random-uuid)"
          exec /opt/kafka/bin/kafka-server-start.sh /tmp/server.properties
      variables:
        HEALTHCHECK_TCP_PORT: "9092"
  before_script:
    - |
        curl "https://api.github.com/repos/qoretechnologies/${REPO_NAME}/statuses/${CI_COMMIT_SHA}" \
        -X POST --oauth2-bearer ${GITHUB_ACCESS_TOKEN} -H "Content-Type: application/json" \
        -d "{\"state\": \"pending\", \"context\": \"${REPO_NAME}\", \"description\": \"Gitlab CI\", \"target_url\": \"${CI_JOB_URL}\"}"
    - set +e

variables:
  REPO_NAME: module-jni
  POSTGRES_PASSWORD: omq
  QORE_DB_CONNSTR: pgsql:postgres/omq@postgres%postgres
  MQTT_CONNECTION: "mqtttcp://artemis:61616"
  KAFKA_CONNECTION: "kafka://kafka:9092"
  OPCUA_CONNECTION: "opc.tcp://opcua:4840"
  JMS_CONNECTION: "tcp://artemis:61616"
  ARTEMIS_JAKARTA_JAR_URL: "https://repo1.maven.org/maven2/org/apache/activemq/artemis-jakarta-client-all/2.40.0/artemis-jakarta-client-all-2.40.0.jar"
  TZ: Europe/Prague
  PGTZ: Europe/Prague

test-ubuntu:
  stage: test
  image: $CI_REGISTRY/infrastructure/qore-test-base/qore-test-base:develop
  script:
    - |
        if test/docker_test/test-ubuntu.sh; then
          curl "https://api.github.com/repos/qoretechnologies/${REPO_NAME}/statuses/${CI_COMMIT_SHA}" \
            -X POST --oauth2-bearer ${GITHUB_ACCESS_TOKEN} -H "Content-Type: application/json" \
            -d "{\"state\": \"success\", \"context\": \"${REPO_NAME}\", \"description\": \"Gitlab CI\", \"target_url\": \"${CI_JOB_URL}\"}"
          exit 0
        else
          curl "https://api.github.com/repos/qoretechnologies/${REPO_NAME}/statuses/${CI_COMMIT_SHA}" \
            -X POST --oauth2-bearer ${GITHUB_ACCESS_TOKEN} -H "Content-Type: application/json" \
            -d "{\"state\": \"failure\", \"context\": \"${REPO_NAME}\", \"description\": \"Gitlab CI\", \"target_url\": \"${CI_JOB_URL}\"}"
          exit 1
        fi
  artifacts:
    when: always
    paths:
      - qualification/
    expire_in: 7 days

test-alpine:
  stage: test
  image: $CI_REGISTRY/infrastructure/qore-test-base/qore-test-base:develop-alpine
  script:
    - |
        if test/docker_test/test-alpine.sh; then
          curl "https://api.github.com/repos/qoretechnologies/${REPO_NAME}/statuses/${CI_COMMIT_SHA}" \
            -X POST --oauth2-bearer ${GITHUB_ACCESS_TOKEN} -H "Content-Type: application/json" \
            -d "{\"state\": \"success\", \"context\": \"${REPO_NAME}\", \"description\": \"Gitlab CI\", \"target_url\": \"${CI_JOB_URL}\"}"
          exit 0
        else
          curl "https://api.github.com/repos/qoretechnologies/${REPO_NAME}/statuses/${CI_COMMIT_SHA}" \
            -X POST --oauth2-bearer ${GITHUB_ACCESS_TOKEN} -H "Content-Type: application/json" \
            -d "{\"state\": \"failure\", \"context\": \"${REPO_NAME}\", \"description\": \"Gitlab CI\", \"target_url\": \"${CI_JOB_URL}\"}"
          exit 1
        fi
  artifacts:
    when: always
    paths:
      - qualification/
    expire_in: 7 days
