stages:
  - test

default:
  tags:
    - k8s
    - amd64
  services:
    - name: postgres:18
      variables:
        HEALTHCHECK_TCP_PORT: "5432"
    - name: open62541/open62541:latest
      alias: opcua
      variables:
        HEALTHCHECK_TCP_PORT: "4840"
    - name: quay.io/artemiscloud/activemq-artemis-broker:artemis.2.38.0
      alias: artemis
      entrypoint: ["/bin/sh", "-ec"]
      command:
        - |
          /opt/amq/bin/artemis create \
            --user "$AMQ_USER" \
            --password "$AMQ_PASSWORD" \
            --role admin \
            --name broker \
            --allow-anonymous \
            --host 0.0.0.0 \
            --http-host 0.0.0.0 \
            --force \
            --no-fsync \
            --silent \
            --no-mqtt-acceptor \
            /home/jboss/broker
          # disable the disk usage check; the broker shares the runner node's disk, and when it is more
          # than <max-disk-usage> (90%) full, Artemis blocks producers and closes MQTT connections when
          # a message is published ("AMQ834002: Error processing control packet"), which the client sees
          # as "Connection lost (32109) - java.io.EOFException"; this broker holds only throwaway test
          # data, so the check serves no purpose here
          sed -i 's|<max-disk-usage>[^<]*</max-disk-usage>|<max-disk-usage>-1</max-disk-usage>|' \
            /home/jboss/broker/etc/broker.xml
          grep -q '<max-disk-usage>-1</max-disk-usage>' /home/jboss/broker/etc/broker.xml
          exec /home/jboss/broker/bin/artemis run
      variables:
        AMQ_USER: admin
        AMQ_PASSWORD: admin
        HEALTHCHECK_TCP_PORT: "61616"
    # single-node KRaft Kafka broker for the KafkaDataProvider integration test; the configuration is written
    # explicitly because the image turns every KAFKA_* environment variable into a broker property, and the
    # job variables (including KAFKA_CONNECTION) are passed to all service containers; the health check on the
    # client port holds the job until the broker accepts connections
    - name: apache/kafka:3.9.0
      alias: kafka
      entrypoint: ["/bin/sh", "-ec"]
      command:
        - |
          cat > /tmp/server.properties <<'EOF'
          process.roles=broker,controller
          node.id=1
          controller.quorum.voters=1@localhost:9093
          listeners=PLAINTEXT://0.0.0.0:9092,CONTROLLER://localhost:9093
          advertised.listeners=PLAINTEXT://kafka:9092
          controller.listener.names=CONTROLLER
          inter.broker.listener.name=PLAINTEXT
          listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          log.dirs=/tmp/kraft-logs
          num.partitions=1
          auto.create.topics.enable=true
          offsets.topic.replication.factor=1
          transaction.state.log.replication.factor=1
          transaction.state.log.min.isr=1
          group.initial.rebalance.delay.ms=0
          EOF
          /opt/kafka/bin/kafka-storage.sh format --ignore-formatted -c /tmp/server.properties \
            -t "$(/opt/kafka/bin/kafka-storage.sh random-uuid)"
          exec /opt/kafka/bin/kafka-server-start.sh /tmp/server.properties
      variables:
        HEALTHCHECK_TCP_PORT: "9092"
  before_script:
    - . test/docker_test/tree-tested-skip.sh

variables:
  REPO_NAME: module-jni
  POSTGRES_PASSWORD: omq
  QORE_DB_CONNSTR: pgsql:postgres/omq@postgres%postgres
  MQTT_CONNECTION: "mqtttcp://artemis:61616"
  KAFKA_CONNECTION: "kafka://kafka:9092"
  OPCUA_CONNECTION: "opc.tcp://opcua:4840"
  JMS_CONNECTION: "tcp://artemis:61616"
  ARTEMIS_JAKARTA_JAR_URL: "https://repo1.maven.org/maven2/org/apache/activemq/artemis-jakarta-client-all/2.40.0/artemis-jakarta-client-all-2.40.0.jar"
  TZ: Europe/Prague
  PGTZ: Europe/Prague

# A develop commit whose tree already passed CI (a merged pull request that was up to date with develop) is not tested
# again: tree-already-tested.sh finds the pipeline that passed the tree, and every job sources tree-tested-skip.sh
# first, which then ends the job with success.  Without such a pipeline, or when the pipelines cannot be read, the
# whole pipeline runs.  The same job runs in qore's pipelines.
tree-already-tested:
  stage: .pre
  needs:
    - job: github-pending
      artifacts: false
  image: $CI_REGISTRY/infrastructure/qore-test-base/qore-test-base:develop
  services: []
  before_script: []
  variables:
    GIT_DEPTH: "3"
  # only a push (a merge) reuses a passed tree: a pipeline started manually, by a schedule or by a trigger tests the
  # tree again, as the test images (mutable develop tags) may have changed since it passed
  rules:
    - if: $CI_COMMIT_BRANCH == "develop" && $CI_PIPELINE_SOURCE == "push"
  script:
    - python3 -B -W error test/docker_test/test_squash_head.py
    - sh test/docker_test/tree-already-tested.sh
  artifacts:
    reports:
      dotenv: tree-tested.env

test-ubuntu:
  stage: test
  needs:
    - job: github-pending
      artifacts: false
    - job: tree-already-tested
      optional: true
  image: $CI_REGISTRY/infrastructure/qore-test-base/qore-test-base:develop
  script:
    - test/docker_test/test-ubuntu.sh
  artifacts:
    when: always
    paths:
      - qualification/
    expire_in: 7 days

# The JDK of the Debian packages and of the RPMs below Fedora 44; the images have JDK 25.
test-ubuntu-jdk21:
  stage: test
  needs:
    - job: github-pending
      artifacts: false
    - job: tree-already-tested
      optional: true
  image: $CI_REGISTRY/infrastructure/qore-test-base/qore-test-base:develop
  before_script:
    - . test/docker_test/tree-tested-skip.sh
  script:
    - test/docker_test/test-ubuntu-jdk21.sh
  artifacts:
    when: always
    paths:
      - qualification/
    expire_in: 7 days

test-alpine:
  stage: test
  needs:
    - job: github-pending
      artifacts: false
    - job: tree-already-tested
      optional: true
  image: $CI_REGISTRY/infrastructure/qore-test-base/qore-test-base:develop-alpine
  script:
    - test/docker_test/test-alpine.sh
  artifacts:
    when: always
    paths:
      - qualification/
    expire_in: 7 days

# The required check represents this pipeline, including any platform jobs that reused a tested tree.
.github-status-job:
  image: $CI_REGISTRY/infrastructure/qore-test-base/qore-test-base:develop
  services: []
  before_script: []

github-pending:
  extends: .github-status-job
  stage: .pre
  script:
    - sh test/docker_test/ci-github-status.sh pending

pipeline-passed:
  extends: .github-status-job
  stage: .post
  when: on_success
  needs:
    - job: github-pending
      artifacts: false
    - job: tree-already-tested
      optional: true
      artifacts: false
    - job: test-ubuntu
      artifacts: false
    - job: test-ubuntu-jdk21
      artifacts: false
    - job: test-alpine
      artifacts: false
  script:
    - sh test/docker_test/ci-github-status.sh passed
  artifacts:
    when: always
    paths: [ci-pipeline-passed]
    expire_in: 7 days

github-status:
  extends: .github-status-job
  stage: .post
  when: always
  needs:
    - job: pipeline-passed
      artifacts: true
  script:
    - sh test/docker_test/ci-github-status.sh final
